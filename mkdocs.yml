site_name: rodeo
site_description: GitHub and GitLab push webhooks for Spring Boot
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation:
      - Docker: installation/docker.md
      - Linux and macOS: installation/linux.md
      - Windows: installation/windows.md
  - Configuration: configuration.md
  - Running rodeo: running.md
  - Logs: logs.md
  - Examples: examples.md
  - rodeo.toml reference: rodeo-toml.md
  - Guides:
      - Deploy on push: deployment.md
