site_name: rodeo
site_description: GitHub and GitLab push webhooks for Spring Boot
docs_dir: docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - rodeo.toml:
      - Overview: rodeo-toml/index.md
      - Pipelines and stages: rodeo-toml/pipelines-and-stages.md
      - Dependencies and conditions: rodeo-toml/dependencies-and-conditions.md
      - Execution controls: rodeo-toml/execution.md
      - Environment and secrets: rodeo-toml/environment-and-secrets.md
      - Validation and errors: rodeo-toml/validation.md
      - Reference: rodeo-toml/reference.md
  - Installation:
      - Docker: installation/docker.md
      - Linux and macOS: installation/linux.md
      - Windows: installation/windows.md
  - Configuration: configuration.md
  - Running rodeo: running.md
  - Logs: logs.md
  - Commit status: commit-status.md
  - Examples: examples.md
  - Guides:
      - Deploy on push: deployment.md
