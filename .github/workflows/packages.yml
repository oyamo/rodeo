name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the jar
        run: |
          mvn -B -DskipTests package
          cp target/rodeo-*.jar target/rodeo.jar

      - name: Bundle a Java runtime
        run: |
          jlink \
            --add-modules java.se \
            --output target/runtime \
            --strip-debug \
            --compress=2 \
            --no-header-files \
            --no-man-pages

      - name: Set the package version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build .deb and .rpm packages
        run: |
          mkdir -p dist
          for packager in deb rpm; do
            docker run --rm -e VERSION -v "$PWD:/work" -w /work goreleaser/nfpm:latest \
              package --packager "$packager" --config deploy/nfpm.yaml --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
